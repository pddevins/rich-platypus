---
layout: default
---
<div class="wrap">
  <article class="page">
    <header class="page__header">
      <h1 class="page__title">{{ page.title | escape }}</h1>
      {%- if page.subtitle %}
      <p class="page__standfirst">{{ page.subtitle | escape }}</p>
      {%- endif %}
    </header>

    <div class="prose">
      {{ content }}
    </div>
  </article>
</div>
